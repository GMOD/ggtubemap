name: Hosted files

# The walk files the README, the docs and tools/readme-figures.R read from
# jbrowse.org still serve the cuts they show. R CMD check never touches the
# network, so a file moved or rebuilt in a format ggtubemap does not read
# would otherwise go unnoticed until someone ran the README.
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

jobs:
  hosted:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          needs: check
      - name: Cut each hosted walk file
        env:
          GGTUBEMAP_HOSTED: 'true'
        run: Rscript -e 'testthat::test_local(filter = "hosted", stop_on_failure = TRUE)'
